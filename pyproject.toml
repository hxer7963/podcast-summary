[project]
name = "podcast-summary"
version = "0.1.0"
description = "Agent-friendly podcast and article knowledge hub with atomic fetch, transcribe, and summary skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
fetch = [
    "beautifulsoup4>=4.14.3",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "requests>=2.33.1",
]
subtitle = [
    # YouTube/Bilibili subtitle path uses yt-dlp. No CUDA, safe on macOS/Linux.
    "yt-dlp[default]>=2026.7.4",
]

[tool.uv]
# No dependency group is installed by install.sh unless the user requests it.
# GPU ASR is Docker-based and remains outside this environment.
